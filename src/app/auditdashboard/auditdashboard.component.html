<mat-sidenav-container class="sidenav-container">
  <mat-sidenav mode="side" opened class="sidenav">
    <mat-toolbar color="primary">Menu</mat-toolbar>

    <app-leftsidebar></app-leftsidebar>
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="container-fluid">
       <mat-toolbar color="primary  d-flex  ">
        <h2 class="py-2 flex-grow-1 sub_title ">Auditor Dashboard</h2>
       <span class="spacer"></span>
      <button mat-icon-button><mat-icon>notifications</mat-icon></button>
      <button mat-icon-button><mat-icon>account_circle</mat-icon></button>
    </mat-toolbar>


    <div class="dashboard-content">
       <div class="container-fluid">
        <div class="row py-2">
          <div class="row">
             <div class="col-md-12">
        <p>Global audit overview for the current financial quarter.</p>

             </div>
          </div>
         <div class="col-sm-12 col-md-6 col-lg-3 my-2"  *ngFor="let item of stats">
           <mat-card class="stat-card  py-4 card_app">
            <mat-card-header>
              <mat-icon mat-card-avatar [style.color]="item.color">{{item.icon}}</mat-icon>
              <mat-card-title class="card_title">{{item.value}}</mat-card-title>
              <mat-card-subtitle class="card_sub_title" >{{item.title}}</mat-card-subtitle>
            </mat-card-header>
          </mat-card>

         </div>

      </div>
      <div class="row">
         <div class="col-md-6">
            <mat-card >
  <mat-card-header>
    <mat-card-title class="sub_title">Audit Completion Trend</mat-card-title>

  </mat-card-header>

  <!-- <mat-card-content>
    <div style="display: block;">
      <canvas baseChart
      [data]="lineChartData"
      [options]="lineChartOptions"
      [type]="lineChartType">
    </canvas>
    </div>
  </mat-card-content> -->
    <mat-card-content style="margin-top: 20px;">
    <div style="display: block; height: 300px;">
      <canvas baseChart
        [data]="barChartData"
        [options]="barChartOptions"
        [type]="barChartType">
      </canvas>
    </div>
  </mat-card-content>
</mat-card>
         </div>
         <div class="col-md-6">
             <mat-card style="flex: 1; min-width: 250px;">
    <mat-card-header>
      <mat-card-title class="sub_title">Type Distribution</mat-card-title>
      <!-- <mat-card-subtitle>Compliance vs Financial</mat-card-subtitle> -->
    </mat-card-header>
    <mat-card-content>
      <div style="max-height: 300px;">
        <canvas baseChart
          [data]="pieChartData"
          [options]="pieChartOptions"
          [type]="pieChartType">
        </canvas>
      </div>
    </mat-card-content>
  </mat-card>

         </div>
      </div>
       </div>

      <!-- <mat-grid-list cols="4"  gutterSize="4px">
        <mat-grid-tile *ngFor="let item of stats">
              vvv
        </mat-grid-tile>
      </mat-grid-list> -->
<!--
      <mat-card class="main-chart-card">
        <mat-card-header>
          <mat-card-title>Monthly Revenue Overview</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <div class="placeholder-chart">
            <p>Chart or Data Table Placeholder</p>
          </div>
        </mat-card-content>
      </mat-card> -->
    </div>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
