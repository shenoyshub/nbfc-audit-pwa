<div class="d-flex vh-100">
  <mat-sidenav-container class="flex-grow-1">
    <mat-sidenav mode="side" opened class="sidebar">
      <h5 class="px-3 pt-3 text-white">AuditHub</h5>
      <mat-nav-list>
        <a mat-list-item>Audit Universe</a>
        <a mat-list-item>Entity Management</a>
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content>
      <mat-toolbar color="white" class="border-bottom">
        <span class="fw-bold">Audit Configuration Hub</span>
      </mat-toolbar>

      <div class="p-3">
        <table mat-table [dataSource]="dataSource" class="w-100 mat-elevation-z1">

          <ng-container matColumnDef="auditType">
            <th mat-header-cell *matHeaderCellDef>Audit Type</th>
            <td mat-cell *matCellDef="let row">
              <b>{{row.name}}</b>
              <div class="small text-muted">{{row.code}}</div>
            </td>
          </ng-container>

          <ng-container matColumnDef="category">
            <th mat-header-cell *matHeaderCellDef>Category</th>
            <td mat-cell *matCellDef="let row">{{row.category}}</td>
          </ng-container>

          <ng-container matColumnDef="frequency">
            <th mat-header-cell *matHeaderCellDef>Frequency</th>
            <td mat-cell *matCellDef="let row">{{row.frequency}}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
