<mat-sidenav-container class="sidenav-container">
 <mat-sidenav mode="side" [opened]="true" class="sidenav" [ngClass]="{ expanded: isExpanded }">
      <div class="d-flex w-100">
         <mat-toolbar color="primary">Menu</mat-toolbar>
            <div>
              <button mat-icon-button class="d-block d-md-none" (click)="toggleSideMenu()"><mat-icon>cancel</mat-icon></button>
            </div>

      </div>

    <app-leftsidebar></app-leftsidebar>
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="container-fluid">
      <mat-toolbar color="primary  d-flex  ">
         <!-- <button mat-icon-button (click)="toggleSideMenu()"><mat-icon>menu</mat-icon></button> -->
        <h2 class="py-2 flex-grow-1 sub_title "> &nbsp; </h2>
        <span class="spacer"></span>
        <button mat-icon-button><mat-icon>notifications</mat-icon></button>
        <button mat-icon-button><mat-icon>account_circle</mat-icon></button>
          <span><button class="d-block d-md-none" mat-icon-button (click)="toggleSideMenu()"><mat-icon  >menu</mat-icon></button></span>

      </mat-toolbar>


      <div class="dashboard-content">
        <div class="container-fluid">
          <div class="row py-2">

            <div class="col-md-12 d-flex flex-column flex-md-row">
                <div class="flex-grow-1">
                  <h2 class="  sub_title mb-0 ">Audit Category</h2>
                  <p class=" flex-grow-1" >Create Audit category.</p>
                </div>
               <button   class="btn-save" (click)="showForm = !showForm">
  <mat-icon>
add
</mat-icon> Create Audit Category
</button>

            </div>
            <div class="col-md-12">

            </div>
            <div class="col-md-12 py-2 ">
                 <mat-card class="stat-card  py-2 card_app card_app_btn_div" *ngIf="showForm">
                <mat-card-header >
               <div class="w-100" >
  <form [formGroup]="auditForm" (ngSubmit)="onSubmit()">
      <div class="container-fluid">
        <div class="row">
       <div class="col-md-4 col-lg-3">
          <mat-form-field appearance="outline" class="w-100">
      <mat-label>Category code</mat-label>
      <input formControlName="groupName" matInput />
    </mat-form-field>

       </div>
        <div class="col-md-4 col-lg-3">
          <mat-form-field appearance="outline" class="w-100">
      <mat-label>Category Name</mat-label>
      <input formControlName="groupName" matInput />
    </mat-form-field>

       </div>


        <div class="col-md-4 col-lg-3">
       <mat-form-field appearance="outline" class="menu-form-field w-100">
  <mat-label>Select Regulators</mat-label>

  <mat-select multiple >
    <mat-option *ngFor="let skill of usersgroup" [value]="skill">
      {{ skill }}
    </mat-option>
  </mat-select>
</mat-form-field>

<!-- <p>Selected: {{ selectedSkills | json }}</p> -->

       </div>
       <div class="col-md-6">
          <mat-form-field appearance="outline" class="menu-form-field w-100">
  <mat-label>Description</mat-label>
  <textarea matInput placeholder="Description"></textarea>
</mat-form-field>
       </div>
     </div>
      </div>

    <button class="btn-save"ype="submit" [disabled]="auditForm.invalid"  > <mat-icon>save</mat-icon> Save</button>
  </form>
</div>
</mat-card-header>
</mat-card>
            </div>

            <div class="col-sm-12 col-md-6 col-lg-4  my-2">
              <mat-card class="stat-card  py-1 card_app card_app_btn_div">
                <mat-card-header class="d-flex flex-column">
                  <!-- <div class="d-flex flex-row-reverse pb-1">
                     <span class="badge bg-success float-right  ">Active</span>
                  </div> -->
                  <div class="d-flex">
                    <div class=" bd-highlight flex-grow-1 txt_blue"> <mat-icon mat-card-avatar
                        class="mb-0  ">category</mat-icon> </div>
                    <div class=" bd-highlight  btn_sml "><mat-icon mat-card-avatar
                        class="mb-0 flex-grow-1 ">edit</mat-icon></div>
                    <div class=" bd-highlight btn_sml"><mat-icon mat-card-avatar
                        class="mb-0 flex-grow-1 ">delete</mat-icon></div>
                  </div>
                  <div class="pb-3">
                    <mat-card-title class="card_title_xs">Category Name</mat-card-title>
                    <mat-card-subtitle class="card_sub_title_xs   ">RBI  </mat-card-subtitle>
                    <mat-card-subtitle class="card_sub_title_xs ">Audits focused on credit risk, asset quality, and fraud risk </mat-card-subtitle>


                  </div>
                </mat-card-header>
              </mat-card>

            </div>


          </div>

        </div>


      </div>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
